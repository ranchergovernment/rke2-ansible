---

- name: Show journalctl -e
  ansible.builtin.command: >-
    journalctl -e --lines 200 --no-pager
  changed_when: false
  register: command_output
  tags:
    - troubleshooting
  ignore_errors: true

- name: Show journalctl -e
  ansible.builtin.debug:
    var: command_output.stdout_lines
  tags:
    - troubleshooting
  ignore_errors: true

- name: Show journalctl -ue rke2-server
  ansible.builtin.command: >-
    journalctl -eu rke2-server --lines 200 --no-pager
  changed_when: false
  register: command_output
  tags:
    - troubleshooting
  ignore_errors: true

- name: Show journalctl -ue rke2-server
  ansible.builtin.debug:
    var: command_output.stdout_lines
  tags:
    - troubleshooting
  ignore_errors: true

- name: Read redacted RKE2 config file
  ansible.builtin.command:
    argv:
      - sed
      - -E
      - 's/^([[:space:]]*(token|agent-token):).*/\1 <redacted>/'
      - /etc/rancher/rke2/config.yaml
  changed_when: false
  register: command_output
  tags:
    - troubleshooting
  ignore_errors: true

- name: Show redacted RKE2 config file
  ansible.builtin.debug:
    var: command_output.stdout_lines
  tags:
    - troubleshooting
  ignore_errors: true
