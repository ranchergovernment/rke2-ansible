---

- name: Create images directory
  ansible.builtin.file:
    path: "{{ rke2_data_dir }}/agent/images"
    state: directory
    mode: '0644'

- name: Download images tar files url
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ rke2_data_dir }}/agent/images"
    mode: "0644"
  when:
    - rke2_images_urls != []
    - not legacy_ansible_modern_python
  with_items: "{{ rke2_images_urls }}"
  notify: "Restart {{ service_name }}"

# WIP: Attempt to fix mismatch between legacy Ansible and modern Python
#################################################################################################
- name: Use curl to download images tar files url  # noqa: command-instead-of-module
  ansible.builtin.shell: >-
    curl -sSfL "{{ item }}" -o "{{ rke2_data_dir }}/agent/images/{{ item | basename }}"
    && chmod 0644 "{{ rke2_data_dir }}/agent/images/{{ item | basename }}"
  when:
    - rke2_images_urls != []
    - legacy_ansible_modern_python
  loop: "{{ rke2_images_urls }}"
  notify: "Restart {{ service_name }}"
  changed_when: true
#################################################################################################

- name: Copy local tarball images
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ rke2_data_dir }}/agent/images/"
    mode: '0644'
  with_items:
    - "{{ rke2_images_local_tarball_path }}"
  when:
    - rke2_images_local_tarball_path != []
  notify: "Restart {{ service_name }}"
