---

# Disable Firewalld
# We recommend disabling firewalld. For Kubernetes 1.19+, firewalld must be turned off.
- name: Disable FIREWALLD
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - ansible_facts.services["firewalld.service"] is defined
    - ansible_facts.services["firewalld.service"].status != "not-found"
    - not rke2_ignore_firewalld
  notify: "Restart {{ service_name }}"
  tags: ["setup-os"]

- name: Include task file network_manager_fix.yaml
  ansible.builtin.include_tasks: network_manager_fix.yaml
  tags: ["setup-os"]

- name: Add server iptables rules
  ansible.builtin.include_tasks: iptables_rules.yml
  when:
    # - ansible_facts.services["iptables.service"] is defined
    - rke2_add_iptables_rules | bool
  tags: ["setup-os"]

- name: Add fapolicyd rules
  ansible.builtin.copy:
    content: "{{ fapolicyd_rules }}"
    dest: /etc/fapolicyd/rules.d/80-rke2.rules
    mode: '0644'
    owner: root
    group: fapolicyd
  when:
    - ansible_facts.services["fapolicyd.service"] is defined
    - ansible_facts.services["fapolicyd.service"].state == "running"
  vars:
    fapolicyd_rules: |
      allow perm=any all : dir={{ rke2_data_dir | dirname }}
      allow perm=any all : dir=/opt/cni/
      allow perm=any all : dir=/run/k3s/
      allow perm=any all : dir=/var/lib/kubelet/
  notify: Restart fapolicyd
  tags: ["setup-os"]

# RKE2 list kernel-modules-extra as a hard requirement
# Documentation: https://docs.rke2.io/install/requirements
# Specifying the kernel here avoids potential reboot in the event the kernel is upgraded
- name: Ensure kernel-modules-extra is installed on EL10
  ansible.builtin.dnf:
    name: "kernel-modules-extra-{{ ansible_facts['kernel'] }}"
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_version'] is match('^10')

- name: Determine if legacy Ansible is running modern Python
  ansible.builtin.set_fact:
    legacy_ansible_modern_python: true
  when:
    - ansible_version.full is version('2.16', '<')
    - ansible_facts['python_version'] is version('3.12', '>=')

- name: Check if curl is installed and working
  ansible.builtin.command: curl --version
  register: curl_check
  failed_when: false
  changed_when: false
  when:
    - legacy_ansible_modern_python

- name: Set has_curl fact based on exit status
  ansible.builtin.set_fact:
    has_curl: "{{ curl_check.rc == 0 }}"
  when:
    - legacy_ansible_modern_python

- name: Enforce curl requirement when running legacy Ansible (before 2.16) with modern Python (3.12+)
  ansible.builtin.assert:
    that:
      - not legacy_ansible_modern_python or has_curl
    fail_msg: >-
      Ansible is older than 2.16 and host Python is 3.12+, but 'curl' is missing 
      on the host. Update Ansible to 2.16+ or install curl on the target hosts.
    success_msg: "Ansible and Python versions are matched"
