---

# Disable Firewalld
# We recommend disabling firewalld. For Kubernetes 1.19+, firewalld must be turned off.
- name: Disable FIREWALLD
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when:
    - ansible_facts.services["firewalld.service"] is defined
    - ansible_facts.services["firewalld.service"].status != "not-found"
    - not rke2_ignore_firewalld
  notify: "Restart {{ service_name }}"
  tags: ["setup-os"]

- name: Include task file network_manager_fix.yaml
  ansible.builtin.include_tasks: network_manager_fix.yaml
  tags: ["setup-os"]

- name: Add server iptables rules
  ansible.builtin.include_tasks: iptables_rules.yml
  when:
    # - ansible_facts.services["iptables.service"] is defined
    - rke2_add_iptables_rules | bool
  tags: ["setup-os"]

- name: Add fapolicyd rules
  ansible.builtin.copy:
    content: "{{ fapolicyd_rules }}"
    dest: /etc/fapolicyd/rules.d/80-rke2.rules
    mode: '0644'
    owner: root
    group: fapolicyd
  when:
    - ansible_facts.services["fapolicyd.service"] is defined
    - ansible_facts.services["fapolicyd.service"].state == "running"
  vars:
    fapolicyd_rules: |
      allow perm=any all : dir="{{ rke2_data_dir | dirname }}"
      allow perm=any all : dir=/opt/cni/
      allow perm=any all : dir=/run/k3s/
      allow perm=any all : dir=/var/lib/kubelet/
  notify: Restart fapolicyd
  tags: ["setup-os"]

# Kubernetes/RKE2 requires swap disabled, the overlay/br_netfilter kernel
# modules loaded, and bridged-traffic sysctls enabled. Rocky/RHEL/Ubuntu cloud
# images already satisfy this; SUSE (e.g. SLE Micro) does not, so this is
# scoped to that OS family only to avoid changing behavior for other users.
- name: SUSE-specific kernel/network prerequisites
  when: ansible_facts['os_family'] == 'Suse'
  tags: ["setup-os"]
  block:
    - name: Disable swap for the current session
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | default(0) > 0
      changed_when: true

    - name: Disable swap entries in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules required by RKE2
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Persist required kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/rke2.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Set sysctl parameters required by RKE2 networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-rke2-networking.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: '0644'
      notify: Restart systemd-sysctl
