---

- name: Get versions from update.rke2.io
  ansible.builtin.uri:
    url: https://update.rke2.io/v1-release/channels/{{ rke2_channel }}
    follow_redirects: safe
    remote_src: true
  register: rke2_version_url
  when:
    - not legacy_ansible_modern_python

# WIP: Attempt to fix mismatch between legacy Ansible and modern python
######################################################################################
- name: Get versions from update.rke2.io (via curl and awk url_effective)
  ansible.builtin.command:
    cmd: >-
      curl -s -o /dev/null -L -w "%{url_effective}" https://update.rke2.io/v1-release/channels/{{ rke2_channel }}
      | awk -F'/' '{print $NF}'
  when:
    - legacy_ansible_modern_python
  register: rke2_version_url_raw
  changed_when: false

- name: Normalize curl output to match uri module register schema
  ansible.builtin.set_fact:
    rke2_version_url:
      json:
        latest: "{{ rke2_version_url_raw.stdout | trim }}"
  when:
    - legacy_ansible_modern_python
######################################################################################

- name: Set rke2_install_version fact from internet source
  ansible.builtin.set_fact:
    rke2_install_version: "{{ rke2_version_url.url | ansible.builtin.urlsplit('path') | ansible.builtin.basename }}"
  changed_when: false
